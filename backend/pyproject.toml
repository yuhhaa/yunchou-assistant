[project]
name = "fleet-recovery-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23,<26",
    "httpx>=0.27,<1",
    "redis>=5,<7",
    "celery[redis]>=5.4,<6",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.test-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
